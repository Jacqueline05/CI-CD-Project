apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-cd-demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ci-cd-demo-app
  template:
    metadata:
      labels:
        app: ci-cd-demo-app
    spec:
      containers:
        - name: app
          image: image-registry.openshift-image-registry.svc:5000/ci-cd-project/ci-cd-demo-app:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ci-cd-demo-app
spec:
  selector:
    app: ci-cd-demo-app
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ci-cd-demo-app
spec:
  to:
    kind: Service
    name: ci-cd-demo-app
  port:
    targetPort: 8080
