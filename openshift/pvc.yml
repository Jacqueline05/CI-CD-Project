apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oc-pipelines-console-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: ci-cd-git-auth
type: Opaque
stringData:
  note: "Configure repository credentials through the OpenShift console; do not commit real secrets."
